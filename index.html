<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alfabeto en Lengua de Señas Mexicana (LSM)</title>
<meta name="description" content="Aprende el alfabeto manual de la Lengua de Señas Mexicana, letra por letra.">
<meta name="theme-color" content="#f6f1e9">
<style>
  :root{
    --bg:#f6f1e9; --ink:#1f2a33; --muted:#6b7680; --card:#ffffff;
    --accent:#c4532d; --accent-ink:#ffffff; --line:#e4dccf;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
  a{color:inherit}
  .wrap{max-width:520px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  header .title{font-size:.9rem;color:var(--muted);line-height:1.3}
  header .title b{color:var(--ink);display:block;font-size:1rem}
  .btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:10px 16px;font:inherit;font-size:.95rem;cursor:pointer;text-decoration:none;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* Letter view */
  .stage{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
  .stage video{display:block;width:100%;aspect-ratio:480/854;max-height:68vh;object-fit:cover;background:#ece6dc}
  .badge{position:absolute;top:12px;left:12px;background:var(--accent);color:#fff;border-radius:16px;
    min-width:72px;height:72px;padding:0 14px;display:flex;align-items:center;justify-content:center;
    font-size:2.6rem;font-weight:800;letter-spacing:.02em;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  .count{position:absolute;top:14px;right:14px;background:rgba(31,42,51,.75);color:#fff;
    font-size:.8rem;padding:4px 10px;border-radius:999px}
  .controls{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-top:12px;align-items:center}
  .controls .btn{width:100%}
  .hint{text-align:center;color:var(--muted);font-size:.85rem;margin:12px 0 0}

  /* Alphabet grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
  .grid a{display:flex;align-items:center;justify-content:center;aspect-ratio:1;background:var(--card);
    border:1px solid var(--line);border-radius:14px;font-size:1.6rem;font-weight:700;text-decoration:none}
  .grid a:active{background:var(--accent);color:#fff}
  h1{font-size:1.5rem;margin:8px 0 4px}
  .intro{color:var(--muted);margin:0 0 16px;line-height:1.45}
  footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:20px;line-height:1.5}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title"><b>Alfabeto LSM</b>Lengua de Señas Mexicana</div>
    <a class="btn" id="toGrid" href="./">Ver alfabeto</a>
  </header>

  <main id="letterView" hidden>
    <div class="stage">
      <video id="vid" autoplay muted loop playsinline preload="auto" disablepictureinpicture></video>
      <div class="badge" id="badge"></div>
      <div class="count" id="count"></div>
    </div>
    <div class="controls">
      <a class="btn" id="prev" href="#">‹ Anterior</a>
      <button class="btn" id="slow" type="button" aria-pressed="false" title="Ver más lento">🐢 Lento</button>
      <a class="btn primary" id="next" href="#">Siguiente ›</a>
    </div>
    <p class="hint">El video se repite solo. Usa “Lento” para ver bien el movimiento.</p>
  </main>

  <main id="gridView" hidden>
    <h1>Alfabeto manual</h1>
    <p class="intro">Toca una letra para ver cómo se hace en Lengua de Señas Mexicana.</p>
    <nav class="grid" id="grid" aria-label="Letras"></nav>
  </main>

  <footer>Alfabeto manual de la Lengua de Señas Mexicana (LSM)</footer>
</div>

<script>
  // id = file name in /v and value used in ?l=..., label = what is shown
  const LETTERS = [
    ["a","A"],["b","B"],["c","C"],["d","D"],["e","E"],["f","F"],["g","G"],["h","H"],
    ["i","I"],["j","J"],["k","K"],["l","L"],["ll","LL"],["m","M"],["n","N"],["nn","Ñ"],
    ["o","O"],["p","P"],["q","Q"],["r","R"],["rr","RR"],["s","S"],["t","T"],["u","U"],
    ["v","V"],["w","W"],["x","X"],["y","Y"],["z","Z"]
  ];
  const ids = LETTERS.map(l => l[0]);
  const $ = id => document.getElementById(id);
  const vid = $("vid");
  let slow = false;

  function normalize(raw){
    if (!raw) return null;
    let k = raw.trim().toLowerCase();
    if (k === "ñ" || k === "%c3%b1" || k === "enie" || k === "ny") k = "nn";
    return ids.includes(k) ? k : null;
  }

  function hrefFor(id){ return "?l=" + id; }

  function showGrid(){
    $("letterView").hidden = true;
    $("gridView").hidden = false;
    $("toGrid").hidden = true;
    document.title = "Alfabeto en Lengua de Señas Mexicana (LSM)";
    vid.removeAttribute("src"); vid.load();
  }

  function showLetter(id){
    const i = ids.indexOf(id);
    const label = LETTERS[i][1];
    $("gridView").hidden = true;
    $("letterView").hidden = false;
    $("toGrid").hidden = false;
    $("badge").textContent = label;
    $("count").textContent = (i + 1) + " / " + ids.length;
    document.title = "Letra " + label + " · Alfabeto LSM";
    vid.src = "v/" + id + ".mp4";
    vid.setAttribute("aria-label", "Seña de la letra " + label + " en LSM");
    vid.playbackRate = slow ? 0.5 : 1;
    const p = vid.play(); if (p && p.catch) p.catch(() => {});
    const prev = ids[(i - 1 + ids.length) % ids.length];
    const next = ids[(i + 1) % ids.length];
    $("prev").href = hrefFor(prev); $("prev").dataset.id = prev;
    $("next").href = hrefFor(next); $("next").dataset.id = next;
    // warm the cache for the next clip
    const pre = document.createElement("link");
    pre.rel = "prefetch"; pre.href = "v/" + next + ".mp4"; document.head.appendChild(pre);
  }

  function route(){
    const id = normalize(new URLSearchParams(location.search).get("l"));
    id ? showLetter(id) : showGrid();
  }

  // in-page navigation without full reloads
  function go(e){
    const id = e.currentTarget.dataset.id;
    if (!id) return;
    e.preventDefault();
    history.pushState(null, "", hrefFor(id));
    showLetter(id);
  }
  $("prev").addEventListener("click", go);
  $("next").addEventListener("click", go);
  $("toGrid").addEventListener("click", e => { e.preventDefault(); history.pushState(null, "", "./"); showGrid(); });
  window.addEventListener("popstate", route);

  $("slow").addEventListener("click", () => {
    slow = !slow;
    $("slow").setAttribute("aria-pressed", String(slow));
    vid.playbackRate = slow ? 0.5 : 1;
  });
  vid.addEventListener("loadeddata", () => { vid.playbackRate = slow ? 0.5 : 1; });

  // swipe left/right on the video
  let x0 = null;
  vid.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, {passive:true});
  vid.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 50) (dx < 0 ? $("next") : $("prev")).click();
  });

  // build the grid
  const grid = $("grid");
  LETTERS.forEach(([id, label]) => {
    const a = document.createElement("a");
    a.href = hrefFor(id); a.textContent = label; a.dataset.id = id;
    a.setAttribute("aria-label", "Letra " + label);
    a.addEventListener("click", go);
    grid.appendChild(a);
  });

  route();
</script>
</body>
</html>
